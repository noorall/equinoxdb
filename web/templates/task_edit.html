<!-- templates/edit.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>编辑任务</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 p-6">
<div class="container mx-auto max-w-3xl">
    <div class="mb-4">
        <a href="/" class="text-blue-600 hover:underline">← 返回首页</a>
    </div>
    <h1 class="text-2xl font-bold mb-6">编辑任务</h1>
    <form action="/task/save" method="POST" class="bg-white p-6 rounded shadow space-y-4">
        <input type="hidden" name="id" value="{{.ID}}">
        <div>
            <label class="block font-semibold">用户名</label>
            <input type="text" name="username" class="w-full border px-3 py-2 rounded" value="{{.Username}}" required />
        </div>
        <div>
            <label class="block font-semibold">书签</label>
            <input type="text" name="bookmark" class="w-full border px-3 py-2 rounded" value="{{.Bookmark}}" required />
        </div>
        <div>
            <label class="block font-semibold">安全码</label>
            <input type="text" name="secure_code" class="w-full border px-3 py-2 rounded" value="{{.SecureCode}}" required />
        </div>
        <div>
            <label class="block font-semibold">击杀怪物/轮</label>
            <input type="number" name="kill_per_round" class="w-full border px-3 py-2 rounded" value="{{.KillPerRound}}" required />
        </div>
        <div>
            <label class="block font-semibold">跑图延迟（毫秒）</label>
            <input type="number" name="delay_ms" class="w-full border px-3 py-2 rounded" min="0" value="{{.DelayMS}}" required />
        </div>
        <div>
            <label class="block font-semibold">刷怪地点</label>
            <select name="location" class="w-full border px-3 py-2 rounded">
                <option value="0" {{if eq .Type 0}}selected{{end}}>马六甲-蓝色妖姬(推荐等级：100+)</option>
                <option value="1" {{if eq .Type 1}}selected{{end}}>威尼斯-土龙(推荐等级：30+)</option>
                <option value="2" {{if eq .Type 2}}selected{{end}}>威尼斯-病鸡(推荐等级：0+)</option>
                <option value="3" {{if eq .Type 3}}selected{{end}}>马六甲-牛蛙(推荐等级：100+)</option>
            </select>
        </div>
        <div class="grid grid-cols-3 gap-4">
            <label><input type="checkbox" name="auto_fix_equipment" {{if .AutoFixEquipment}}checked{{end}} /> 自动修装</label>
            <label><input type="checkbox" name="auto_sale_equipment" {{if .AutoSaleEquipment}}checked{{end}} /> 自动卖装</label>
            <label><input type="checkbox" name="auto_refill_stamina" {{if .AutoRefillStamina}}checked{{end}} /> 自动补充体力</label>
        </div>
        <div>
            <label class="block font-semibold">自动使用物品（用 ; 分隔）</label>
            <input type="text" name="auto_use_items" class="w-full border px-3 py-2 rounded" value="{{.AutoUseItems}}" />
        </div>
        <div>
            <label class="block font-semibold">自动使用药品（用 ; 分隔）</label>
            <input type="text" name="auto_use_potions" class="w-full border px-3 py-2 rounded" value="{{.AutoUsePotions}}" />
        </div>
        <div>
            <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">保存任务</button>
        </div>
    </form>
</div>
</body>
</html>

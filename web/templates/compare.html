<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>任务数据对比</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100 p-6">
<div class="container mx-auto">
    <h1 class="text-2xl font-bold mb-6">任务数据对比</h1>
    <canvas id="compareChart" width="800" height="400"></canvas>
    <div class="mt-6">
        <a href="/" class="text-blue-600 hover:underline">返回任务列表</a>
    </div>
</div>

<script>
    const labels = {{.Labels}};
    const writtenData = {{.WrittenData}};
    const durationData = {{.DurationData}};

    const ctx = document.getElementById('compareChart').getContext('2d');
    new Chart(ctx, {
        type: 'bar',
        data: {
            labels: labels,
            datasets: [
                {
                    label: '写入总量 (MB)',
                    data: writtenData,
                    backgroundColor: 'rgba(54, 162, 235, 0.6)'
                },
                {
                    label: '写入耗时 (s)',
                    data: durationData,
                    backgroundColor: 'rgba(255, 99, 132, 0.6)'
                }
            ]
        },
        options: {
            responsive: true,
            scales: {
                y: { beginAtZero: true }
            }
        }
    });
</script>
</body>
</html>

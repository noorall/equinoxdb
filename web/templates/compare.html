<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>任务数据对比</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100 p-6">
<div class="container mx-auto">
    <div class="flex justify-between items-center mb-4">
        <h1 class="text-2xl font-bold">EquinoxDB-原型展示平台-数据对比</h1>
        <a href="/" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">返回首页</a>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
        <!-- 写入总量图表 -->
        <div class="bg-white shadow rounded-xl p-6">
            <h2 class="text-lg font-semibold mb-4">写入总量 (MB)</h2>
            <canvas id="writtenChart" class="w-full h-80"></canvas>
        </div>

        <!-- 写入耗时图表 -->
        <div class="bg-white shadow rounded-xl p-6">
            <h2 class="text-lg font-semibold mb-4">写入耗时 (秒)</h2>
            <canvas id="durationChart" class="w-full h-80"></canvas>
        </div>
    </div>

</div>

<script>
    const barPercentage = 1.0  // 调整为更合适的宽度比例
    const categoryPercentage = 0.2
    const labels = {{.Labels}};

    // 假设数据结构为二维数组（每个标签对应[任务一值, 任务二值]）
    const writtenData = {{.WrittenData}};  // 格式示例：[[100, 150], [200, 250]]
    const durationData = {{.DurationData}}; // 格式示例：[[5, 7], [10, 12]]

    // 数据拆分逻辑（从二维数组提取任务数据）
    const writtenTask1 = writtenData.map(d => d[0])
    const writtenTask2 = writtenData.map(d => d[1])
    const durationTask1 = durationData.map(d => d[0])
    const durationTask2 = durationData.map(d => d[1])

    const commonOptions = {
        responsive: true,
        interaction: { mode: 'nearest', axis: 'x', intersect: false },
        plugins: { tooltip: { mode: 'nearest' } },
        scales: {
            x: {
                grid: { drawOnChartArea: false },
                // 添加分组配置确保柱状并排显示
                stacked: false
            },
            y: {
                beginAtZero: true,
                stacked: false
            }
        }
    };

    // 写入总量图表
    new Chart(document.getElementById('writtenChart'), {
        type: 'bar',
        data: {
            labels: labels,
            datasets: [
                {
                    label: '任务一 写入总量',
                    data: writtenTask1,
                    backgroundColor: 'rgba(54, 162, 235, 0.8)', // 蓝色
                    barPercentage: barPercentage,
                    categoryPercentage: categoryPercentage
                },
                {
                    label: '任务二 写入总量',
                    data: writtenTask2,
                    backgroundColor: 'rgba(255, 159, 64, 0.8)', // 橙色
                    barPercentage: barPercentage,
                    categoryPercentage: categoryPercentage
                }
            ]
        },
        options: commonOptions
    });

    // 写入耗时图表
    new Chart(document.getElementById('durationChart'), {
        type: 'bar',
        data: {
            labels: labels,
            datasets: [
                {
                    label: '任务一 写入耗时',
                    data: durationTask1,
                    backgroundColor: 'rgba(75, 192, 192, 0.8)', // 绿色
                    barPercentage: barPercentage,
                    categoryPercentage: categoryPercentage
                },
                {
                    label: '任务二 写入耗时',
                    data: durationTask2,
                    backgroundColor: 'rgba(153, 102, 255, 0.8)', // 紫色
                    barPercentage: barPercentage,
                    categoryPercentage: categoryPercentage
                }
            ]
        },
        options: commonOptions
    });
</script>

</body>
</html>
